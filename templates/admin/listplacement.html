{% extends 'adminLayout.html' %}
{% load static %}
{% block content %}
<body >
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
            <h5 class="fw-semibold mb-0">
                Placement List
            </h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>No.</th>
                            <th>Name</th>
                            <th>Role</th>
                            <th>Company Name</th>
                            <th>Image</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if placements %}
                        {% for p in placements %}
                        <tr>
                            <td>{{ p.id }}</td>
                            <td>{{ p.name }}</td>
                            <td>{{ p.role }}</td>
                            <td>{{ p.company_name }}</td>
                            <td><img src="{{ p.image.url }}" alt="{{ p.name }}" style="width: 50px; height: 70px; object-fit: cover;"></td>
                        </tr>
                        {% endfor %}
                        {% else %}
                        <tr>
                            <td>No placements</td>
                        </tr>
                        {% endif %}

                    </tbody>


                </table>


            </div>

        </div>

    </div>

   
</body>
{% endblock %}
